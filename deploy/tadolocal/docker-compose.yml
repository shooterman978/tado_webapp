# TadoLocal Spike — Proxmox LXC (primary) / Windows Docker (appendix)
#
# Upstream: https://github.com/AmpScm/TadoLocal
# Pinned release tag: 1.1.2 (commit d5a09976dfbec6d235c6b13cc136faad00de7642)
# Official image is built from Upstream Dockerfile + entrypoint.sh (env-driven).
#
# Default network: host — required for reliable HomeKit / mDNS on the same LAN
# as the Tado V3 bridge. See README for bridge/macvlan alternatives.
#
# DB permissions: Upstream Dockerfile sets USER tado (uid 1000). Named Docker
# volumes are created as root → SQLite fails with "unable to open database file".
# We override to user 0:0 for the spike so /data is writable. Optional hardening:
#   docker run --rm -v tadolocal-data:/data alpine chown -R 1000:1000 /data
#   then set user: "1000:1000" instead of "0:0".

services:
  tado-local:
    container_name: tado-local
    image: tadolocal:1.1.2
    build:
      # Pin to Upstream release tag (reproducible rebuild)
      context: https://github.com/AmpScm/TadoLocal.git#1.1.2
    # Override Dockerfile USER tado — see header comment (DB open failed fix)
    user: "0:0"
    restart: unless-stopped
    # Host networking: container shares the LXC (or host) stack → same LAN as Bridge
    network_mode: host
    env_file:
      - .env
    environment:
      TADO_PORT: ${TADO_PORT:-4407}
    volumes:
      # Pairing state + SQLite history (survives recreate)
      - tado-data:/data
    # With network_mode: host, `ports:` is ignored — API listens on TADO_PORT on the host/LXC IP.
    # For bridge networking instead, use: docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d

volumes:
  tado-data:
    name: tadolocal-data
